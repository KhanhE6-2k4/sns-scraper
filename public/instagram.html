<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Scraper</title>
    <link rel="icon" type="image/png" href="assets/scraper-logo.png">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/instagram.css">
    <script src="/js/site.js"></script>
</head>

<body>

<div class="platform-switcher">
    <button
        id="platformToggle"
        type="button"
        aria-expanded="false"
        aria-controls="platformMenu"
    >
        <span>Platforms</span>
        <span>▾</span>
    </button>

    <div id="platformMenu" class="dropdown-menu hidden">
        <a href="/tiktok" data-platform="tiktok">TikTok Tool</a>
        <a href="/instagram" data-platform="instagram">Instagram Tool</a>
        <a href="/youtube" data-platform="youtube">YouTube Tool</a>
        <a href="/threads" data-platform="threads">Threads Tool</a>
        <a href="/facebook" data-platform="facebook">Facebook Tool</a>
    </div>
</div>

<a href="/" class="home-link">← Trang chủ</a>

<div class="container">
    <div class="page-title">
        <img
            src="/assets/instagram.png"
            alt="Instagram"
            class="page-logo"
        >
        <h1>Instagram Scraper</h1>
    </div>

    <div class="google-sheet-section">
        <label for="googleSheetUrl">Google Sheet</label>
        <input
            id="googleSheetUrl"
            type="text"
            placeholder="Dán URL Google Sheet..."
            autocomplete="off"
        >

        <div class="google-sheet-actions">
            <button id="validateGoogleSheetBtn" type="button">Kiểm tra</button>
            <button id="exportGoogleSheetBtn" type="button" disabled>
                Nhập vào Google Sheet
            </button>
        </div>

        <div id="googleSheetStatus" class="google-sheet-status"></div>
    </div>

    <!-- Actor tìm bài đăng bằng cookie của tài khoản Instagram đã đăng nhập -->
    <label for="instagramCookies">Instagram Cookies</label>
    <input
        id="instagramCookies"
        type="text"
        placeholder="sessionid=xxxxxx"
        autocomplete="off"
        spellcheck="false"
    >

    <label>Kiểu tìm kiếm</label>
    <div class="search-type">
        <label class="search-type-option">
            <input
                type="radio"
                name="searchType"
                value="keyword"
                checked
            >
            <span>Từ khóa</span>
        </label>
    </div>

    <label for="keywords">Nội dung tìm kiếm</label>
    <textarea
        id="keywords"
        placeholder="Nhập mỗi cụm từ truy vấn trên một dòng"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
    ></textarea>

    <div class="filter-section">
        <label>Verified (có tích xanh)</label>
        <div class="filter-body">
            <div class="radio-group">
                <label>
                    <input type="radio" name="filterVerified" value="any" checked>
                    Không dùng
                </label>
                <label>
                    <input type="radio" name="filterVerified" value="verified">
                    Có
                </label>
                <label>
                    <input type="radio" name="filterVerified" value="not_verified">
                    Không
                </label>
            </div>
        </div>
    </div>

    <!-- Average Likes: trung bình likes các bài gần nhất, lấy từ Profile Actor -->
    <div class="filter-section">
        <label>Lọc theo số Likes trung bình</label>
        <div class="filter-body">
            <div class="radio-group">
                <label>
                    <input type="radio" name="filterAverageLikes" value="no" checked>
                    Không
                </label>
                <label>
                    <input type="radio" name="filterAverageLikes" value="yes">
                    Có
                </label>
            </div>

            <div id="averageLikesOptions" class="filter-grid">
                <div class="filter-group">
                    <label for="minAverageLikes">Số Likes trung bình tối thiểu</label>
                    <input
                        id="minAverageLikes"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        autocomplete="off"
                        disabled
                    >
                </div>
                <div class="filter-group">
                    <label for="maxAverageLikes">Số Likes trung bình tối đa</label>
                    <input
                        id="maxAverageLikes"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        autocomplete="off"
                        disabled
                    >
                </div>
            </div>
        </div>
    </div>

    <!-- Search Actor không hỗ trợ lọc thời gian nên không có bộ lọc Thời gian -->

    <label for="limit">Số lượng profile tối đa mỗi truy vấn</label>
    <input id="limit" type="number" value="10" min="1" max="500">

    <div class="btn-wrapper">
        <button id="runBtn" type="button">
            Tìm kiếm
        </button>
    </div>

    <div id="status"></div>
    <div id="result"></div>
</div>

<script src="/js/instagram.js"></script>
</body>
</html>
